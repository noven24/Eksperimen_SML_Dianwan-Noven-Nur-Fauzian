name: Automated Data Preprocessing

permissions:
  contents: write

on:
  push:
    paths:
      - 'namadataset_raw/**'
      - 'preprocessing/automate_Dianwan-Noven-Nur-Fauzian.py'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn

    - name: Run preprocessing script
      run: |
        python preprocessing/automate_Dianwan-Noven-Nur-Fauzian.py --input namadataset_raw/insurance.csv --output preprocessing/namadataset_preprocessing/insurance_preprocessed.csv
        
    - name: Commit and push processed data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/namadataset_preprocessing/insurance_preprocessed.csv
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update processed dataset"
        git push
        
    - name: Simpan Dataset Bersih sebagai Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dataset-clean
        path: preprocessing/namadataset_preprocessing/insurance_preprocessed.csv
        retention-days: 7
